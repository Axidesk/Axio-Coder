<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axio Coder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/vs2015.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        /* Custom scrollbar for dark theme */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #121212; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
        
        /* Scrollbar transparente para o input */
        textarea::-webkit-scrollbar-track { background: transparent; }
        
        /* Chat messages styling to match dark theme */
        .message { margin-bottom: 1.5rem; line-height: 1.6; }
        .message.user { 
            color: #888888; 
            font-weight: normal; 
            white-space: pre-wrap; 
            word-break: break-word; 
            padding-bottom: 2rem; 
            border-bottom: 1px solid #333; 
        }
        
        .message.user:last-child {
            border-bottom: none;
        }
        .message.ai { 
            color: #ffffff; 
            padding-bottom: 2rem; 
            border-bottom: 1px solid #333; 
            text-align: left !important;
        }
        
        .message.ai:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }
        .message.system { color: #6b7280; font-style: italic; font-size: 0.875rem; text-align: center; align-self: center; width: 100%; }
        
        .diff-added { color: rgb(144, 160, 21); font-weight: bold; }
        .diff-deleted { color: #f43f5e; }
        .diff-modified { color: #0ea5e9; }
        .diff-unmodified { color: #6b7280; }

        /* Undo/redo: item riscado quando desfeito */
        .undo-struck { opacity: 0.45; }
        .undo-struck .undo-title { text-decoration: line-through; color: #6b7280; }

        /* Item da pilha de edições selecionado (hover persistente de seleção) */
        .diff-selected > div:first-child {
            background: rgba(255, 255, 255, 0.08) !important;
        }
        .diff-selected .undo-title {
            color: #ffffff !important;
        }
        
        /* Remove outline from textarea */
        textarea:focus { outline: none; }

        /* Ajustes do bloco de código gerado pela IA */
        .code-block-container *::-webkit-scrollbar { height: 4px; }
        .code-block-container *::-webkit-scrollbar-track { background: transparent !important; }
        .code-block-container *::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
        .code-block-container *::-webkit-scrollbar-thumb:hover { background: #777; }
        .code-block-container pre { margin: 0; overflow-x: auto; }
        .code-block-container code { background: transparent !important; padding: 0 !important; font-size: 0.85em; font-weight: normal; }

        /* Spinner de carregamento (círculo girando) ao lado de "Logs da Sessão" */
        .logs-spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(144, 160, 21, 0.22);
            border-top-color: rgb(144, 160, 21);
            border-radius: 50%;
            animation: logs-spin 1.4s linear infinite;
            flex-shrink: 0;
            z-index: 1;
        }
        @keyframes logs-spin {
            to { transform: rotate(360deg); }
        }

        /* Card do log pulsando suavemente enquanto está em processamento.
           O pulso usa um overlay (::after) próprio para não conflitar com a
           seleção (log-card-active): "pulsando" ≠ "selecionado". O overlay
           respira entre transparente e a cor de hover (0.05), ficando mais
           fraco que a seleção (0.08) e permitindo acumular os dois estados. */
        .log-card::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: rgba(255, 255, 255, 0.05);
            opacity: 0;
            pointer-events: none;
            z-index: 0;
            transition: opacity 0.2s;
        }
        .log-card.log-pulsing::after {
            animation: logs-pulse 2.4s ease-in-out infinite;
        }
        @keyframes logs-pulse {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }

        /* Diff de duas colunas (Código Substituído) sem overflow horizontal */
        .diff-two-col {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            align-items: start;
            max-width: 100%;
        }
        .diff-two-col > .diff-col {
            min-width: 0;
        }
        .diff-two-col > .diff-col:first-child {
            padding-right: 0.75rem;
            border-right: 1px solid rgba(255, 255, 255, 0.06);
        }
        .diff-two-col > .diff-col:last-child {
            padding-left: 0.75rem;
        }
        .diff-two-col .diff-col-text {
            white-space: pre-wrap;
            overflow-wrap: break-word;
            word-break: break-word;
            max-width: 100%;
        }

        /* Fontes e card de log no padrão da versão canvas */
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        .log-card {
            background: transparent;
            transition: background 0.15s;
        }
        .log-card:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        .log-card.log-card-active {
            background: rgba(255, 255, 255, 0.08);
        }
        .log-card.log-card-active:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        /* Seleção padronizada dos cards do histórico (fundo cinza, sem contorno) */
        .history-round-selected {
            background: rgba(255, 255, 255, 0.08) !important;
        }
        /* Header do card de sessão no histórico: mesmo padrão suave do .log-card */
        .session-history-header {
            background: transparent;
            transition: background 0.15s ease;
        }
        .session-history-header:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        .session-history-header.session-history-active,
        .session-history-header.session-history-active:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        /* Card do histórico: linha divisória fina cinzenta apenas quando expandido */
        .session-history-card {
            border-bottom: 1px solid transparent;
            transition: border-color 0.15s ease;
        }
        .session-history-card.session-history-expanded {
            border-bottom-color: #444;
        }
        /* Sub-card de rodada do histórico: mesmo padrão suave do .log-card */
        .history-round-card {
            background: transparent;
            transition: background 0.15s ease;
        }
        .history-round-card:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        .history-round-card.history-round-selected,
        .history-round-card.history-round-selected:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        /* Cards de arquivo no padrão dos cards de log (sem fundo, hover/seleção sutis) */
        .file-card-header {
            background: transparent;
            transition: background 0.15s;
        }
        .file-card-header:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        .file-card-header.file-card-selected {
            background: rgba(255, 255, 255, 0.08);
        }
        .panel-empty {
            color: #777;
            font-style: italic;
            font-size: 13px;
            padding: 16px;
            text-align: center;
        }
        /* Seleção para exclusão via Ctrl+clique: borda de destaque fina, sem poluir */
        .log-card.log-delete-selected,
        .session-history-header.log-delete-selected,
        .history-round-card.log-delete-selected {
            box-shadow: inset 0 0 0 1px rgb(144, 160, 21);
        }
        #sliding-panel-container {
            transition: transform 0.4s ease;
        }
        /* Transição suave entre os cards de log e do histórico */
        @keyframes logsFadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes logsFadeOut {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(-6px); }
        }
        .logs-fade-in {
            animation: logsFadeIn 0.25s ease;
        }
        .logs-fade-out {
            animation: logsFadeOut 0.2s ease forwards;
        }
        /* Camada GPU para o wrapper dos logs, evitando "engasgo" no fade
           (o translateY da animação sobe/desce os cards de forma fluida). */
        .logs-wrapper {
            will-change: transform, opacity;
            transform: translateZ(0);
            backface-visibility: hidden;
        }
    </style>
</head>
<body class="bg-[#121212] text-gray-300 h-screen flex flex-col overflow-hidden relative">

    <!-- Hidden elements to prevent renderer.js from crashing -->
    <div id="lbl-folder" class="hidden"></div>
    <div id="lbl-metrics" class="hidden"></div>



    <!-- Popup de Alerta -->

            <p class="text-gray-300 mb-6">Por favor, selecione a pasta raiz do seu projeto.</p>
            <button id="btn-close-alert" class="bg-[#333] hover:bg-[#444] text-white font-medium py-2 px-4 rounded transition-colors w-full">
                Ok
            </button>
        </div>
    </div>

    <!-- Popup de Confirmação de Exclusão -->

            </div>
        </div>
    </div>

    <!-- Sliding Panel Container -->

            <div class="flex justify-between items-center p-4 border-b border-[#333]">
                <div class="flex items-center gap-3">
                    <h2 id="panel-title" class="text-lg font-semibold text-gray-200">Logs da Sessão</h2>
                </div>
                <button id="btn-close-panel" class="text-gray-400 hover:text-white transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <div id="log-list-container" class="flex-1 overflow-y-auto p-2" style="scrollbar-gutter: stable;">
                <div id="current-logs-wrapper" class="logs-wrapper space-y-2"></div>
                <div id="history-logs-wrapper" class="logs-wrapper hidden space-y-2"></div>
            </div>
            <div id="log-delete-bar" class="hidden border-t border-[#333] p-3 bg-[#1e1e1e]">
                <div class="flex items-center gap-3">
                    <span id="lbl-delete-count" class="text-xs text-gray-400 font-mono flex-1">0 selecionado(s)</span>
                    <button id="btn-confirm-delete" class="bg-[#b91c1c] hover:bg-[#dc2626] text-white text-sm font-medium py-1.5 px-3 rounded transition-colors">Excluir</button>
                </div>
            </div>
        </div>
        
        <!-- Col 2: Files -->
        <div id="panel-col-2" class="w-80 shrink-0 bg-[#1e1e1e]/95 backdrop-blur-md border-r border-[#333] h-full flex flex-col hidden">
            <div class="p-4 flex justify-between items-center border-b border-[#333]">
                <div class="flex items-center gap-3 flex-1 min-w-0">
                    <h2 class="text-lg font-semibold text-gray-200">Arquivos</h2>
                    <div class="flex items-center gap-2">
                        <button id="btn-show-thoughts" class="text-gray-500 hover:text-[#3b82f6] transition-colors focus:outline-none" title="Ver raciocínio da IA (Chain of Thought)">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>
                        </button>
                        <button id="btn-show-tools" class="text-gray-500 hover:text-[rgb(144,160,21)] transition-colors focus:outline-none" title="Ver ferramentas usadas nesta resposta">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 12-8.373 8.373a1 1 0 1 1-1.414-1.414L13.586 10.586"/><path d="m18.293 11.707 1.414-1.414a1 1 0 0 0 0-1.414l-4.586-4.586a1 1 0 0 0-1.414 0l-1.414 1.414a1 1 0 0 0 0 1.414l4.586 4.586a1 1 0 0 0 1.414 0Z"/></svg>

                            <svg id="eye-on" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.964-7.178Z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg id="eye-off" class="h-5 w-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88"/></svg>
                        </button>
                    </div>
                </div>
                <button id="btn-close-col-2" class="text-gray-400 hover:text-white transition-colors shrink-0 ml-4">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <div id="files-list-container" class="flex-1 overflow-y-auto p-2 space-y-2" style="scrollbar-gutter: stable;">
                </div>
        </div>

        <div id="panel-col-3" class="w-[calc(100vw-43.5rem)] shrink-0 bg-[#1e1e1e]/95 backdrop-blur-md border-r border-[#333] h-full flex flex-col hidden">
            <div class="p-4 flex justify-between items-center border-b border-[#333]">
                <div class="flex items-center gap-2 flex-1 min-w-0">
                    <h2 id="col-3-title" class="text-lg font-semibold text-gray-200 truncate">Código</h2>
                    <button id="btn-undo" class="hidden text-gray-400 hover:text-[rgb(144,160,21)] transition-colors focus:outline-none disabled:opacity-30 disabled:cursor-not-allowed" title="Desfazer última edição">

                    </button>
                    <span id="lbl-undo-count" class="hidden text-xs text-gray-400 font-mono mr-2" title="Edições que podem ser desfeitas"></span>
                    <button id="btn-redo" class="hidden text-gray-400 hover:text-[rgb(144,160,21)] transition-colors focus:outline-none disabled:opacity-30 disabled:cursor-not-allowed" title="Refazer edição">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 14l4-4-4-4m4 4H8a5 5 0 00-5 5v1a5 5 0 005 5h9" /></svg>
                    </button>
                    <span id="lbl-redo-count" class="hidden text-xs text-gray-400 font-mono" title="Edições que podem ser refeitas"></span>
                    <button id="btn-copy-tools" class="hidden text-gray-400 hover:text-white transition-colors focus:outline-none" title="Copiar log de ferramentas">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" /></svg>

                <div class="flex items-center gap-2 shrink-0 ml-4">
                    <button id="btn-close-col-3" class="text-gray-400 hover:text-white transition-colors shrink-0">

                            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />

                </div>
            </div>
            <div id="code-view-container" class="flex-1 overflow-y-auto overflow-x-hidden p-2 font-mono text-sm whitespace-pre-wrap" style="scrollbar-gutter: stable;">
                </div>
        </div>
        </div>
    </div>

    <!-- Main Layout -->
    <div class="flex-1 flex flex-row w-full overflow-hidden relative">
        <!-- Sidebar -->
        <div class="w-14 shrink-0 bg-[#1e1e1e] flex flex-col items-center py-6 gap-6 z-40">
            <button id="btn-select-folder" class="text-white hover:text-gray-300 transition-colors" title="Selecionar Pasta">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" />
                </svg>
            </button>
            <button id="btn-open-log" class="text-white hover:text-[#3b82f6] transition-colors" title="Ver Log de Alterações">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />

                </button>
                <div id="mode-popup" class="absolute top-0 left-full ml-2 w-48 bg-[#2d2d2d] border border-[#444] rounded-lg shadow-xl hidden z-50">
                    <ul class="py-1 text-sm text-gray-300">

            </div>
            <button id="btn-counselor" class="text-white hover:text-[#3b82f6] transition-colors" title="Modo Conselheiro (DeepSeek)">

                    <path stroke-linecap="round" stroke-linejoin="round" d="M17 8h2a2 2 0 012 2v6a2 2 0 01-2 2h-2v4l-4-4H9a1.994 1.994 0 01-1.414-.586m0 0L11 14h4a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2v4l.586-.586z" />
                </svg>
            </button>
            <button id="btn-session-history" class="text-white hover:text-[#3b82f6] transition-colors" title="Ver histórico de sessões anteriores">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-[23px] w-[23px]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
            </button>
            <button id="btn-settings" class="text-white hover:text-gray-300 transition-colors mt-auto" title="Configurações">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
            </button>
        </div>

        <!-- Left Column: User Chat & Input -->
        <div class="w-[35%] shrink-0 flex flex-col border-r border-[#333] relative">
            <main id="chat-container-left" class="flex-1 overflow-y-auto pt-4 pb-28 px-6">
                <div id="chat-inner-left" class="w-full flex flex-col">
                    <!-- User messages -->
                </div>
            </main>
            <!-- Input Flutuante -->
            <footer id="input-footer" class="absolute bottom-0 left-0 w-[calc(100%-8px)] px-6 pb-8 pt-6 bg-[#121212] pointer-events-none transition-opacity duration-300 z-10">
                <div id="input-footer-inner" class="w-full relative pointer-events-auto transition-opacity duration-300">
                    <div class="bg-[#222222] rounded-3xl px-4 py-3 shadow-lg border border-[#333] flex flex-col relative">
                        <div id="image-preview-container" class="hidden mb-2 flex flex-wrap gap-2">
                            <!-- Imagens anexadas aparecerão aqui -->
                        </div>
                        <div class="flex items-start w-full">
                            <input type="file" id="file-input" accept="image/*" class="hidden">
                            <button id="btn-attach" class="text-gray-400 hover:text-white transition-colors flex-shrink-0 flex items-center justify-center w-8 h-8 rounded-full hover:bg-[#333] mt-0.5 mr-2">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13" />
                                </svg>
                            </button>
                            <textarea id="input-text" rows="1" class="flex-1 bg-transparent text-gray-200 font-normal placeholder-gray-400 focus:placeholder-transparent resize-none max-h-32 pl-2 py-1 mr-2" placeholder="Digite seu comando aqui"></textarea>
                            <button id="btn-send" class="text-gray-400 hover:text-white transition-colors flex-shrink-0 flex items-center justify-center w-8 h-8 rounded-full hover:bg-[#333] mt-0.5">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 transform rotate-90" viewBox="0 0 20 20" fill="currentColor">
                                    <path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" />
                                </svg>
                            </button>
                        </div>
                    </div>
                    
                    <!-- Status -->
                    <div class="text-center mt-3">
                        <span id="lbl-status" class="text-white text-xs italic">Aguardando seleção do diretório</span>
                        <span id="lbl-executing" class="text-white text-xs italic ml-1"></span>
                    </div>
                </div>
            </footer>
        </div>

        <!-- Right Column: AI Chat -->
        <div class="flex-1 flex flex-col relative w-full min-w-0">
            <main id="chat-container-right" class="flex-1 overflow-y-auto pt-4 pb-0 px-6">
                <div id="chat-inner-right" class="w-full flex flex-col">
                    </div>
            </main>
        </div>
        </div>
    </div>

    <!-- Modal de Imagem Expandida -->
    <div id="image-modal" class="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-[60] hidden cursor-zoom-out" onclick="this.classList.add('hidden')">
        <img id="expanded-image" class="max-w-[90%] max-h-[90%] object-contain rounded-lg shadow-2xl" src="" alt="Expanded Image">
    </div>

    <script src="renderer.js"></script>
</body>
</html>
